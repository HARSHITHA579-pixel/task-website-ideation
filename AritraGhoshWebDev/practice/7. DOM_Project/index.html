<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Item Lister</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header id="main-header">
            <h1>Item Lister</h1>
            <input type="text" id="filter" placeholder="Search Items....">
        </header>
        <main>
            <div class="container" id="input-form">
                <h2>Add Items</h2>
                <form action="">
                    <input type="text" id="add-item">
                    <input type="submit" value="Submit">
                </form>
            </div>
            <div class="container" id="output-list">
                <h2>Items</h2>
                <ul id="list">
                    <li class="item">Item 1 <button class="delete">X</button></li>
                    <li class="item">Item 2 <button class="delete">X</button></li>
                    <li class="item">Item 3 <button class="delete">X</button></li>
                    <li class="item">Item 4 <button class="delete">X</button></li>
                </ul>
            </div>
        </main>

        <script src="app.js"></script>
    </body>
</html>
