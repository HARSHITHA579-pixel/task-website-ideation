<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Item Lister</title>
    </head>
    <body>
        <header id="main-header">
            <h1>Item Lister</h1>
        </header>
        <main>
            <div class="container" id="input-form">
                <h2>Add Items</h2>
                <form action="">
                    <input type="text">
                    <select>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                    <input type="submit" value="Submit">
                </form>
            </div>
            <div class="container" id="output-list">
                <h2>Items</h2>
                <ul id="list">
                    <li class="item">Item 1</li>
                    <li class="item">Item 2</li>
                    <li class="item">Item 3</li>
                    <li class="item">Item 4</li>
                </ul>
                <br>
                <!-- <div>Yo</div> -->
                <!-- <button class="btn" id="button" onclick="buttonClick(1)">Click Here</button> -->
                <button class="btn" id="button">CLick Me</button>
                <br>
                <br>
                <div id="box" style="width:400px; height:200px; background: #f4f4f4">
                    <h3>Hello</h3>
                </div>
            </div>
        </main>

        <script src="dom2.js"></script>
    </body>
</html>
