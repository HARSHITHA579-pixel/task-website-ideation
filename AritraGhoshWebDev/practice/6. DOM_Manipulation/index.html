<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Item Lister</title>
        <style>
            #message {
                width: 400px;
                background: #ddaaaa;
                padding: 20px;
                color: #444;
                margin: 0 auto;
                text-align: center;
                border: 1px solid #ff7777;
                opacity: 0;
            }
            #message.show {
                opacity: 1;
                /* set transitions up */
                -webkit-transition: opacity 0.7s;
                -moz-transition: opacity 0.7s;
                transition: opacity 0.7s;
            }
            #color-changer {
                width: 200px;
                height: 100px;
                margin: 30px auto;
                border: 1px solid #000;
                background: #fff;

                -webkit-transition: background 0.7s;
                -moz-transition: background 0.7s;
                transition: background 0.7s;
            }
        </style>
    </head>
    <body>
        <header id="main-header">
            <h1>Item Lister</h1>
        </header>
        <main>
            <div class="container" id="input-form">
                <h2>Add Items</h2>
                <form action="">
                    <input type="text">
                    <select>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                    <input type="submit" value="Submit">
                </form>
            </div>
            <div class="container" id="output-list">
                <h2>Items</h2>
                <ul id="list">
                    <li class="item">Item 1</li>
                    <li class="item">Item 2</li>
                    <li class="item">Item 3</li>
                    <li class="item">Item 4</li>
                </ul>
                <br>
                <!-- <div>Yo</div> -->
                <!-- <button class="btn" id="button" onclick="buttonClick(1)">Click Here</button> -->
                <button class="btn" id="button">CLick Me</button>
                <br>
                <br>
                <div id="box" style="width:400px; height:200px; background: #f4f4f4">
                    <h3>Hello</h3>
                </div>
            </div>
        </main>
        <aside>
            <div id="color-changer"></div>
            <div id="message">
                <p>This is a message</p>
            </div>
        </aside>

        <script src="dom2.js"></script>
    </body>
</html>
