<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Online Book Shop Contact Us</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar">
<a href="Proj.html">
<img src="logo.jpg"  alt="Book Logo" style="width:100px; height:200;">
</a>
<h1>Contact Us</h1>
</header>
<center>
<form id="contactForm">
<table border="8" width="800" height="500" cellpadding="15" cellspacing="0" bgcolor="white">
<tr bgcolor="#CD5C5C">
<td align="center">
<font size="6" color="white"><b>Contact Us!</b></font>
</td>
</tr>
<tr>
<td>
<input type="text" id="name" size="70" placeholder="Name">
</td>
</tr>
<tr>
<td>
<input type="email" id="email" size="70" placeholder="Email">
</td>
</tr>
<tr>
<td>
<input type="text" id="subject" size="70" placeholder="Subject">
</td>
</tr>
<tr>
<td>
<textarea id="content" rows="6" cols="68" placeholder="Content"></textarea>
</td>
</tr>
<tr>
<td align="center" bgcolor="#f5f5f5">
<input type="submit" value="SUBMIT">
</td>
</tr>
</table>
</form>
<p id="errorMsg" style="color:red; text-align:center;"></p>
</center>
<footer>
<p>2026 Book Shop</p>
</footer>
<script src="script.js"></script>
</body>
</html>
