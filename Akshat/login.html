<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar">
<img src="logo.jpg"  alt="Book Logo" style="width:100px; height:200;">
<h1>Online Book Shop</h1>
</header>
<div class="loginpage">
<div class="loginbox">
  <h2>Login</h2>

  <input type="text" id="username" placeholder="User ID"><br><br>
  <input type="password" id="password" placeholder="Password"><br><br>

  <button onclick="login()">Login</button>
  <p id="error" style="color:red;"></p>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
